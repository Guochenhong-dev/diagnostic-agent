<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Java故障诊断与修复验证</title><link rel="stylesheet" href="style.css"></head>
<body><header><span>DEV DIAGNOSTICS</span><h1>Java应用故障诊断与修复验证</h1><p>从异常日志追溯代码证据，在工作副本中验证修复。</p></header>
<main><section><h2>新建诊断</h2><label>本地访问令牌<input id="token" type="password" value="local-demo-token" autocomplete="off"></label><button id="connect">连接服务 / 刷新项目</button><p id="config"></p><label>项目<select id="project"><option value="npe">npe</option><option value="config">config</option><option value="sql">sql</option></select></label><button id="example">填入故障日志</button><label>异常日志<textarea id="log" rows="9"></textarea></label><label class="inline"><input id="ai" type="checkbox">使用真实大模型（需服务端配置）</label><button class="primary" id="submit">开始诊断</button><p id="message" role="status"></p><h2>历史任务</h2><div id="history"></div></section>
<section><h2>诊断详情</h2><div id="status">选择一个任务，或先运行左侧演示。</div><h3>候选原因</h3><p id="cause"></p><h3>代码证据</h3><div id="evidence"></div><h3>建议验证步骤</h3><ul id="steps"></ul><h3>拟议补丁</h3><pre id="patch"></pre><label class="inline"><input type="checkbox" id="confirm">我已查看补丁，同意在Docker工作副本中执行测试</label><button id="verify" disabled>运行修复前 / 后测试</button><h3>验证结果</h3><pre id="verification">尚未验证</pre><details><summary>执行轨迹</summary><pre id="trace"></pre></details></section></main><script src="app.js"></script></body></html>
